<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>New password · Amore Meet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#0A0A0A;color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.5;}
  .wrap{max-width:440px;margin:0 auto;padding:48px 22px 64px;}
  .logo{display:inline-block;padding:6px 10px;border-radius:8px;background:linear-gradient(135deg,#FE2C55,#25F4EE);color:#0A0A0A;font-weight:800;letter-spacing:1px;font-size:12px;}
  h1{font-family:Georgia,serif;font-size:30px;margin:18px 0 8px;letter-spacing:-0.5px;}
  p{color:#cccccc;font-size:15px;}
  label{display:block;color:#cccccc;font-size:13px;margin:16px 0 6px;}
  input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #2E2E2E;background:#1A1A1A;color:#fff;font-size:16px;}
  button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:999px;background:linear-gradient(135deg,#FE2C55,#25F4EE);color:#0A0A0A;font-weight:800;font-size:16px;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:14px;display:none;}
  .msg.err{display:block;background:rgba(254,44,85,.12);border-left:3px solid #FE2C55;color:#ffd0da;}
  .msg.ok{display:block;background:rgba(37,244,238,.10);border-left:3px solid #25F4EE;color:#d8fffe;}
  [dir=rtl] .msg.err,[dir=rtl] .msg.ok{border-left:0;border-right:3px solid currentColor;}
</style>
</head>
<body>
<div class="wrap">
  <span class="logo">AMORE MEET</span>
  <h1 id="t-title"></h1>
  <p id="t-intro"></p>
  <form id="f" autocomplete="off">
    <label for="p1" id="t-new"></label>
    <input id="p1" type="password" minlength="6" required autocomplete="new-password">
    <label for="p2" id="t-repeat"></label>
    <input id="p2" type="password" minlength="6" required autocomplete="new-password">
    <button id="b" type="submit"></button>
  </form>
  <div id="m" class="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// The recovery email links here with ?token_hash=...&type=recovery (custom "Reset password"
// template). verifyOtp works on any device and browser, unlike the app's PKCE link.
const T = {
  es:{title:'Nueva contraseña',intro:'Escribe tu nueva contraseña para Amore Meet.',nw:'Nueva contraseña (mín. 6 caracteres)',rep:'Repite la contraseña',btn:'Guardar contraseña',mismatch:'Las contraseñas no coinciden.',short:'Usa al menos 6 caracteres.',bad:'El enlace no es válido o ha caducado. Pide uno nuevo desde la app: Iniciar sesión → ¿Olvidaste tu contraseña?',ok:'¡Listo! Tu contraseña ha cambiado. Vuelve a la app e inicia sesión.',err:'No se pudo guardar. Inténtalo de nuevo.'},
  it:{title:'Nuova password',intro:'Scrivi la nuova password per Amore Meet.',nw:'Nuova password (min. 6 caratteri)',rep:'Ripeti la password',btn:'Salva password',mismatch:'Le password non coincidono.',short:'Usa almeno 6 caratteri.',bad:'Il link non è valido o è scaduto. Richiedine uno nuovo dall\'app: Accedi → Password dimenticata?',ok:'Fatto! La password è cambiata. Torna nell\'app e accedi.',err:'Salvataggio non riuscito. Riprova.'},
  en:{title:'New password',intro:'Type your new password for Amore Meet.',nw:'New password (min. 6 characters)',rep:'Repeat the password',btn:'Save password',mismatch:'The passwords do not match.',short:'Use at least 6 characters.',bad:'This link is invalid or has expired. Ask for a new one in the app: Log in → Forgot password?',ok:'Done! Your password has changed. Go back to the app and log in.',err:'Could not save. Please try again.'},
  pt:{title:'Nova senha',intro:'Digite sua nova senha do Amore Meet.',nw:'Nova senha (mín. 6 caracteres)',rep:'Repita a senha',btn:'Salvar senha',mismatch:'As senhas não coincidem.',short:'Use pelo menos 6 caracteres.',bad:'O link é inválido ou expirou. Peça um novo no app: Entrar → Esqueceu a senha?',ok:'Pronto! Sua senha foi alterada. Volte ao app e entre.',err:'Não foi possível salvar. Tente de novo.'},
  fr:{title:'Nouveau mot de passe',intro:'Saisissez votre nouveau mot de passe Amore Meet.',nw:'Nouveau mot de passe (6 caractères min.)',rep:'Répétez le mot de passe',btn:'Enregistrer',mismatch:'Les mots de passe ne correspondent pas.',short:'Utilisez au moins 6 caractères.',bad:'Ce lien n\'est pas valide ou a expiré. Demandez-en un nouveau dans l\'app : Se connecter → Mot de passe oublié ?',ok:'C\'est fait ! Votre mot de passe a changé. Retournez dans l\'app et connectez-vous.',err:'Enregistrement impossible. Réessayez.'},
  de:{title:'Neues Passwort',intro:'Gib dein neues Passwort für Amore Meet ein.',nw:'Neues Passwort (mind. 6 Zeichen)',rep:'Passwort wiederholen',btn:'Passwort speichern',mismatch:'Die Passwörter stimmen nicht überein.',short:'Mindestens 6 Zeichen verwenden.',bad:'Der Link ist ungültig oder abgelaufen. Fordere in der App einen neuen an: Anmelden → Passwort vergessen?',ok:'Fertig! Dein Passwort wurde geändert. Geh zurück in die App und melde dich an.',err:'Speichern fehlgeschlagen. Bitte erneut versuchen.'},
  hi:{title:'नया पासवर्ड',intro:'Amore Meet के लिए अपना नया पासवर्ड लिखें।',nw:'नया पासवर्ड (कम से कम 6 अक्षर)',rep:'पासवर्ड दोबारा लिखें',btn:'पासवर्ड सेव करें',mismatch:'दोनों पासवर्ड मेल नहीं खाते।',short:'कम से कम 6 अक्षर लिखें।',bad:'यह लिंक गलत है या इसकी समय सीमा खत्म हो गई है। ऐप में नया लिंक मांगें: लॉग इन → पासवर्ड भूल गए?',ok:'हो गया! आपका पासवर्ड बदल गया है। ऐप में वापस जाकर लॉग इन करें।',err:'सेव नहीं हो सका। फिर से कोशिश करें।'},
  ar:{title:'كلمة مرور جديدة',intro:'اكتب كلمة المرور الجديدة لحسابك في Amore Meet.',nw:'كلمة المرور الجديدة (6 أحرف على الأقل)',rep:'أعد كتابة كلمة المرور',btn:'حفظ كلمة المرور',mismatch:'كلمتا المرور غير متطابقتين.',short:'استخدم 6 أحرف على الأقل.',bad:'الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من التطبيق: تسجيل الدخول ← نسيت كلمة المرور؟',ok:'تم! تغيّرت كلمة المرور. عد إلى التطبيق وسجّل الدخول.',err:'تعذّر الحفظ. حاول مرة أخرى.'},
  id:{title:'Kata sandi baru',intro:'Tulis kata sandi baru untuk Amore Meet.',nw:'Kata sandi baru (min. 6 karakter)',rep:'Ulangi kata sandi',btn:'Simpan kata sandi',mismatch:'Kata sandi tidak sama.',short:'Gunakan minimal 6 karakter.',bad:'Tautan tidak valid atau sudah kedaluwarsa. Minta yang baru di aplikasi: Masuk → Lupa kata sandi?',ok:'Selesai! Kata sandi Anda sudah diganti. Kembali ke aplikasi dan masuk.',err:'Gagal menyimpan. Coba lagi.'},
  ru:{title:'Новый пароль',intro:'Введите новый пароль для Amore Meet.',nw:'Новый пароль (мин. 6 символов)',rep:'Повторите пароль',btn:'Сохранить пароль',mismatch:'Пароли не совпадают.',short:'Используйте не менее 6 символов.',bad:'Ссылка недействительна или устарела. Запросите новую в приложении: Войти → Забыли пароль?',ok:'Готово! Пароль изменён. Вернитесь в приложение и войдите.',err:'Не удалось сохранить. Попробуйте ещё раз.'}
};
const want = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'es']).map(l => String(l).slice(0, 2).toLowerCase());
const lang = want.find(l => T[l]) || 'es';
const t = T[lang];
document.documentElement.lang = lang;
if (lang === 'ar') document.documentElement.dir = 'rtl';
document.title = t.title + ' · Amore Meet';
for (const [id, k] of [['t-title','title'],['t-intro','intro'],['t-new','nw'],['t-repeat','rep'],['b','btn']]) document.getElementById(id).textContent = t[k];

const m = document.getElementById('m'), f = document.getElementById('f'), b = document.getElementById('b');
const show = (cls, text) => { m.className = 'msg ' + cls; m.textContent = text; };
const sb = window.supabase.createClient('https://lfktavvzjravdmwfttuy.supabase.co', 'sb_publishable_R1UTiUeavTM6I8tCElpUKQ_E0ejbDfm', { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
const q = new URLSearchParams(location.search);
const tokenHash = q.get('token_hash');
let verified = null;
if (!tokenHash || q.get('type') !== 'recovery') { f.style.display = 'none'; show('err', t.bad); }

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
  if (p1.length < 6) return show('err', t.short);
  if (p1 !== p2) return show('err', t.mismatch);
  b.disabled = true;
  try {
    // The token works once: verify only on submit, so opening the page twice does not burn it.
    if (!verified) {
      const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      if (error) { f.style.display = 'none'; return show('err', t.bad); }
      verified = true;
    }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { b.disabled = false; return show('err', t.err + ' (' + error.message + ')'); }
    await sb.auth.signOut();
    f.style.display = 'none';
    show('ok', t.ok);
  } catch (err) {
    b.disabled = false;
    show('err', t.err);
  }
});
</script>
</body>
</html>
